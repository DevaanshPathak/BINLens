name: CI

on:
  push:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python for clang-format
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pinned clang-format
        run: pip install clang-format==22.1.8

      - name: Check formatting
        run: make fmt-check

  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential lcov

      - name: Build
        run: make

      - name: Run tests
        run: make test

      - name: Coverage
        run: make coverage

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck

      - name: Static analysis (src/)
        run: cppcheck --enable=all --inconclusive --std=c11 --error-exitcode=1 --suppress=missingIncludeSystem -Iinclude src/

      - name: Static analysis (tests/)
        run: cppcheck --enable=all --inconclusive --std=c11 --error-exitcode=1 --suppress=missingIncludeSystem -Iinclude tests/

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate